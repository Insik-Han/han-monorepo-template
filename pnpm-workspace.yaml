packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  msw: true
  sharp: true
  workerd: true
catalog:
  dotenv: ^17.2.2
  zod: ^4.1.13
  typescript: ^6
  "@cloudflare/workers-types": ^4.20251213.0
  wrangler: ^4.77.0
  hono: ^4.8.2
  "@orpc/server": ^1.13.14
  "@orpc/openapi": ^1.13.14
  "@orpc/zod": ^1.13.14
  better-auth: 1.6.11
  "@orpc/tanstack-query": ^1.13.14
  "@orpc/client": ^1.13.14
  "@tanstack/react-query": ^5.90.12
  "@tanstack/react-form": ^1.28.0
  "@types/react-dom": ^19.2.3
  "@better-auth/expo": 1.6.11
  # --- i18n (Lingui; app-specific @lingui/vite-plugin / @lingui/metro-transformer stay in each app) ---
  "@lingui/core": ^6.2.0
  "@lingui/react": ^6.2.0
  "@lingui/babel-plugin-lingui-macro": ^6.2.0
  "@lingui/cli": ^6.2.0
  "@lingui/format-po": ^6.2.0
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
  # --- testing ---
  "@playwright/test": ^1.60.0
  "@testing-library/dom": ^10.4.0
  "@testing-library/react": ^16.3.2
  "@testing-library/react-native": ^14.0.0
  "@testing-library/user-event": ^14.6.0
  # jest-expo 56 is built against the jest 29 toolchain (babel-jest, jest-snapshot, ...)
  "@types/jest": ^29.5.0
  jest: ^29.7.0
  jest-expo: ~56.0.4
  jsdom: ^29.0.0
  test-renderer: ^1.2.0
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
