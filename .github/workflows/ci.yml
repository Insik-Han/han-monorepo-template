name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # https://viteplus.dev/guide/ci — installs Vite+, Node, the package
      # manager from package.json#packageManager, and handles dependency caching.
      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          node-version: "26"
          cache: true
      - run: vp install
      - run: vp check
      # turbo `test` task — unit/integration suites incl. packages/evolution
      # structural gates. E2E (Playwright/Maestro) is intentionally excluded.
      - run: vp run test
      # vp build is not part of CI yet: Cloudflare/native builds need secrets.
      # Add a build job here once deploy targets are wired up.

  # lingui catalog sync — re-extracts catalogs on every PR and, when they
  # changed, pushes the diff back to the PR branch as a bot commit instead of
  # failing the build (Lingui v6 dropped `extract --check`). The bot commit is
  # made with GITHUB_TOKEN, so it does not retrigger CI. See docs/agents/i18n.md.
  i18n-extract:
    # same-repo PRs only — fork branches don't exist in this repo and can't be
    # pushed to with GITHUB_TOKEN anyway.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # check out the PR head branch (not the detached merge commit) so the
          # re-extracted catalogs can be pushed back to it.
          ref: ${{ github.head_ref }}
      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          node-version: "26"
          cache: true
      - run: vp install
      - run: vp run i18n:extract
      - name: Push catalog updates to the PR branch
        run: |
          locales="apps/web/src/shared/i18n/locales apps/native/shared/i18n/locales"
          if [ -n "$(git status --porcelain -- $locales)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- $locales
            git commit -m "chore(i18n): re-extract lingui catalogs"
            git push
            echo "::warning::Catalogs were stale — re-extracted and pushed to the PR branch. Translate any new empty msgstr entries before merging."
          fi

  # Self-evolution PRs (label: self-evolving) get a stricter diff-level gate:
  # only allowlisted files may change, and engine self-modifications must ship
  # an ADR in the same diff. See docs/agents/self-evolution.md.
  evolution-guard:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'self-evolving')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          node-version: "26"
          cache: true
      - run: vp install
      - run: vp test run src/evolution-guard.test.ts
        working-directory: packages/evolution
        env:
          EVOLUTION_DIFF_BASE: origin/${{ github.base_ref }}
